project:
  input_root: data/wtq
  output_root: output/wtq-ru-full
  source_language: en
  target_language: ru
  seed: 42

translation:
  mode: full
  answer_language_mode: table

mentions:
  normalization:
    unicode: NFKC
    casefold: true
    collapse_whitespace: true
    strip_outer_punctuation: true
  longest_match_first: true
  include_headers: true
  include_numeric_mentions: true
  allow_lemma_match: false
  allow_fuzzy_match: false
  allow_semantic_match: false
  on_ambiguity: needs_review
  spacy_model: en_core_web_trf
  stop_pos:
    - AUX
    - CCONJ
    - INTJ
    - PUNCT
    - SCONJ
    - DET
    - ADP
    - PART
  exclude_numbers: true
  exclude_dates: false

model:
  provider: openai_compatible
  base_url: http://192.168.55.242:7869/v1
  api_key: ollama
  model_name: qwen3.8:latest
  temperature: 0.0
  max_output_tokens: 4096
  timeout_seconds: 180
  retries: 3

embeddings:
  enabled: true
  provider: openai_compatible
  base_url: http://localhost:11434/v1
  api_key: ollama
  model_name: nomic-embed-text
  timeout_seconds: 180

back_translation:
  enabled: true

table:
  rows_per_chunk: 20

validation:
  question_cosine_threshold: null
  strict_masks: true
  strict_table_shape: true
  strict_immutable_values: true

cache:
  enabled: true
  cache_embeddings: true

runner:
  checkpoint_every: 25
  continue_on_error: true
  retry_failed_on_resume: false
  rerun_needs_review: false

logging:
  level: INFO
  llm_io_enabled: true
  llm_io_path: null
