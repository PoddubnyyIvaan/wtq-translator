project:
  input_root: data/wtq
  output_root: output/wtq-ru-full
  source_language: en
  target_language: ru
  seed: 42

translation:
  mode: full
  answer_language_mode: table
  # Батчинг перевода кандидатов; цифры зависят от num_parallel на Ollama-сервере.
  candidates:
    max_candidates_per_request: 64
    request_concurrency: 32
    # Принудительная транслитерация NER-токенов в переводе табличных кандидатов.
    # По умолчанию выключена: форсинг подменяет транскрипцию модели «побуквенной»
    # схемой и ухудшает качество (см. разбор рана training-eb8e36efb1ce).
    transliteration_enabled: false

mentions:
  normalization:
    unicode: NFKC
    casefold: true
    collapse_whitespace: true
    strip_outer_punctuation: true
  longest_match_first: true
  include_headers: true
  include_numeric_mentions: true
  allow_lemma_match: false
  allow_fuzzy_match: false
  allow_semantic_match: false
  on_ambiguity: needs_review
  spacy_model: en_core_web_trf
  stop_pos:
    - AUX
    - CCONJ
    - INTJ
    - PUNCT
    - SCONJ
    - DET
    - ADP
    - PART
  exclude_numbers: true
  exclude_dates: false

model:
  #provider: ollama
  #base_url: http://192.168.19.127:9886/v1
  base_url: http://localhost:9124/v1
  provider: openai_compatible
  #base_url: http://192.168.55.242:7869/v1
  api_key: ollama
  model_name: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
  #model_name: qwen3.8:latest
  temperature: 0.0
  max_output_tokens: 2500
  timeout_seconds: 180
  retries: 3
  # Глобальный лимит одновременных LLM-запросов; цифры зависят от num_parallel на Ollama-сервере.
  max_concurrent_requests: 64
  # Вариант: нативный Ollama-провайдер (POST /api/chat). base_url — корень сервера БЕЗ /v1.
  # provider: ollama
  # base_url: http://192.168.55.242:7869
  #ollama:
   # think: false
    #stream: false
  #  options: {}

embeddings:
  enabled: true
  provider: openai_compatible
  base_url: http://localhost:11434/v1
  api_key: ollama
  model_name: nomic-embed-text
  timeout_seconds: 180

back_translation:
  enabled: true

table:
  rows_per_chunk: 20

validation:
  question_cosine_enabled: true
  question_bert_enabled: true
  back_table_bert_enabled: true
  question_cosine_threshold: null
  strict_masks: true
  strict_table_shape: true
  strict_immutable_values: true
  back_table_similarity_enabled: true
  back_table_similarity_mode: cell
  back_table_similarity_threshold: null
  back_table_similarity_max_chunk_tokens: 512

bert_score:
  enabled: true
  model_type: bert-base-multilingual-cased
  lang: en
  device: cuda
  batch_size: 10
  rescale_with_baseline: true
  question_threshold: null
  table_threshold: null

cache:
  enabled: true
  cache_embeddings: true

runner:
  # Число одновременно обрабатываемых вопросов; цифры зависят от num_parallel на Ollama-сервере.
  concurrency: 13
  checkpoint_every: 25
  continue_on_error: true
  retry_failed_on_resume: false
  rerun_needs_review: false

logging:
  level: INFO
  llm_io_enabled: true
  llm_io_path: null

domain_detection:
  enabled: true
  max_tokens: 1500
  language: null
